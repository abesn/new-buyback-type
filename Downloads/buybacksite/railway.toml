[build]
builder = "NIXPACKS"
buildCommand = "npm run db:migrate:prod && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "web"

[services.variables]
PORT = "3000"
NODE_ENV = "production"
